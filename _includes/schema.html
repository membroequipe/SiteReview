{% if page.layout == "post" or page.layout == "review" %}
{% if page.avaliacao %}
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": {{ page.modelo | default: page.title | jsonify }},
  "image": "{{ page.image | absolute_url }}",
  "description": {{ page.description | jsonify }},
  "brand": {
    "@type": "Brand",
    "name": {{ page.marca | default: 'Genérica' | jsonify }}
  },
  "review": {
    "@type": "Review",
    "reviewRating": {
      "@type": "Rating",
      "ratingValue": "{{ page.avaliacao.nota }}",
      "bestRating": "10",
      "worstRating": "1"
    },
    {% if page.avaliacao.resumo %}
    "reviewBody": {{ page.avaliacao.resumo | jsonify }},
    {% endif %}
    "author": {
      "@type": "Organization",
      "@id": "{{ '/' | absolute_url }}#organization",
      "name": {{ page.author | default: 'Equipe de Análises' | jsonify }},
      "url": "{{ '/como-pesquisamos/' | absolute_url }}"
    },
    "datePublished": "{{ page.date | date_to_xmlschema }}"{% if page.last_modified_at %},
    "dateModified": "{{ page.last_modified_at | date_to_xmlschema }}"{% endif %}{% if page.avaliacao.vantagens and page.avaliacao.vantagens.size > 0 %},
    "positiveNotes": {
      "@type": "ItemList",
      "itemListElement": [
        {% for item in page.avaliacao.vantagens %}
        {
          "@type": "ListItem",
          "position": {{ forloop.index }},
          "name": {{ item | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }{% endif %}{% if page.avaliacao.desvantagens and page.avaliacao.desvantagens.size > 0 %},
    "negativeNotes": {
      "@type": "ItemList",
      "itemListElement": [
        {% for item in page.avaliacao.desvantagens %}
        {
          "@type": "ListItem",
          "position": {{ forloop.index }},
          "name": {{ item | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }{% endif %}
  }
}
</script>
{% endif %}

<!-- BreadcrumbList Automático -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [{
    "@type": "ListItem",
    "position": 1,
    "name": "Início",
    "item": "{{ '/' | absolute_url }}"
  }{% if page.categories[0] %},{
    "@type": "ListItem",
    "position": 2,
    "name": {{ page.categories[0] | capitalize | jsonify }},
    "item": "{{ '/' | append: page.categories[0] | append: '/' | absolute_url }}"
  },{
    "@type": "ListItem",
    "position": 3,
    "name": {{ page.title | jsonify }}
  }{% else %},{
    "@type": "ListItem",
    "position": 2,
    "name": {{ page.title | jsonify }}
  }{% endif %}]
}
</script>
{% endif %}

{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ '/' | absolute_url }}#website",
      "url": "{{ '/' | absolute_url }}",
      "name": "Sua Melhor Ferramenta",
      "description": "Guias de escolha, comparativos e reviews técnicos de furadeiras e parafusadeiras.",
      "inLanguage": "pt-BR"
    },
    {
      "@type": "Organization",
      "@id": "{{ '/' | absolute_url }}#organization",
      "name": "Sua Melhor Ferramenta",
      "url": "{{ '/' | absolute_url }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ '/assets/images/logo.png' | absolute_url }}"
      }
    }
  ]
}
</script>
{% endif %}
