{% if page.layout == "post" or page.layout == "review" %}
{% if page.avaliacao %}
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ page.title }}",
  "image": "{{ page.image | absolute_url }}",
  "description": "{{ page.description }}",
  "brand": {
    "@type": "Brand",
    "name": "Makita"
  },
  "review": {
    "@type": "Review",
    "reviewRating": {
      "@type": "Rating",
      "ratingValue": "{{ page.avaliacao.nota }}",
      "bestRating": "10"
    },
    "author": {
      "@type": "Person",
      "name": "{{ page.author | default: 'Equipe de Análises' }}"
    },
    "datePublished": "{{ page.date | date_to_xmlschema }}"
  }
}
</script>
{% endif %}

<!-- BreadcrumbList Automático -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [{
    "@type": "ListItem",
    "position": 1,
    "name": "Início",
    "item": "{{ '/' | absolute_url }}"
  },{
    "@type": "ListItem",
    "position": 2,
    "name": "{{ page.categories[0] | capitalize }}",
    "item": "{{ '/' | append: page.categories[0] | append: '/' | absolute_url }}"
  },{
    "@type": "ListItem",
    "position": 3,
    "name": "{{ page.title }}"
  }]
}
</script>
{% endif %}
