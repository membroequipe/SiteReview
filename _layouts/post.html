---
layout: default
---

<article class="post-container">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">Publicado em {{ page.date | date: "%d/%m/%Y" }}</p>
  </header>

  <!-- CAIXA DO ÍNDICE RETRÁTIL AUTOMÁTICA -->
  <div class="toc-container" id="toc-box" style="display: none;">
    <details open>
      <summary><strong>Conteúdo</strong></summary>
      <ol id="auto-toc"></ol>
    </details>
  </div>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>
</article>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const content = document.getElementById("post-content");
    const tocList = document.getElementById("auto-toc");
    const tocBox = document.getElementById("toc-box");
    
    if (!content || !tocList) return;

    // Seleciona todos os títulos H2 e H3 do artigo
    const headings = content.querySelectorAll("h2, h3");

    if (headings.length > 0) {
      headings.forEach((heading, index) => {
        // Cria um ID para o título se não existir
        if (!heading.id) {
          heading.id = "secao-" + (index + 1);
        }

        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#" + heading.id;
        a.textContent = heading.textContent;

        // Se for H3, adiciona um pequeno recuo
        if (heading.tagName.toLowerCase() === "h3") {
          li.style.marginLeft = "1.25rem";
        }

        li.appendChild(a);
        tocList.appendChild(li);
      });

      // Exibe a caixa do índice caso haja títulos
      tocBox.style.display = "block";
    }
  });
</script>
