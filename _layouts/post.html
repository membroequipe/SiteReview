---
layout: default
---

<article class="post-container">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">Publicado em {{ page.date | date: "%d/%m/%Y" }}</p>
  </header>

  <!-- CAIXA DO ÍNDICE RETRÁTIL MODELO ASPIRADORES -->
  <div class="toc-container" id="toc-box" style="display: none;">
    <details open>
      <summary>
        <span class="toc-title">Conteúdo</span>
      </summary>
      <ul id="auto-toc" class="toc-list"></ul>
    </details>
  </div>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>
</article>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const content = document.getElementById("post-content");
    const tocList = document.getElementById("auto-toc");
    const tocBox = document.getElementById("toc-box");
    
    if (!content || !tocList) return;

    const headings = content.querySelectorAll("h2, h3");

    if (headings.length > 0) {
      let h2Count = 0;
      let h3Count = 0;

      headings.forEach((heading, index) => {
        if (!heading.id) {
          heading.id = "secao-" + (index + 1);
        }

        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "#" + heading.id;

        const isH3 = heading.tagName.toLowerCase() === "h3";

        if (isH3) {
          h3Count++;
          li.className = "toc-subitem";
          // Formato: 4.1 Nome do Tópico (Sem ponto após a numeração)
          a.textContent = `${h2Count}.${h3Count} ${heading.textContent}`;
        } else {
          h2Count++;
          h3Count = 0; // reseta a contagem do H3 para o próximo H2
          li.className = "toc-item";
          // Formato: 1 Nome do Tópico (Sem ponto após o número)
          a.textContent = `${h2Count} ${heading.textContent}`;
        }

        li.appendChild(a);
        tocList.appendChild(li);
      });

      tocBox.style.display = "block";
    }
  });
</script>
