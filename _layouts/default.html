<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Automático -->
    {% seo %}

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>
<body class="{% if page.url == '/' or page.url == '/index.html' %}home-page{% endif %}">

    <!-- Menu Superior Limpo e Direto -->
    <header class="site-header">
      <div class="site-header-container">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Sua Melhor Ferramenta" class="site-logo-img">
        </a>
        
        <!-- Botão Hambúrguer Mobile -->
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="site-nav" id="site-nav">
          <ul>
            <!-- 1. Início -->
            <li><a href="{{ '/' | relative_url }}">Início</a></li>

            <!-- 2. Hub de Furadeiras -->
            <li><a href="{{ '/furadeiras/' | relative_url }}">Furadeiras</a></li>

            <!-- 3. Hub de Parafusadeiras -->
            <li><a href="{{ '/parafusadeiras/' | relative_url }}">Parafusadeiras</a></li>
            
            <!-- 4. Hub de Comparativos -->
            <li><a href="{{ '/comparativos/' | relative_url }}">Comparativos</a></li>         

            <!-- 5. Tutoriais e Dicas -->
            <li><a href="{{ '/guias/' | relative_url }}">Tutoriais e Dicas</a></li>
              
            <!-- 6. Sobre -->
            <li><a href="{{ '/sobre/' | relative_url }}">Sobre</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="site-content">
        {{ content }}
    </main>

    <!-- Rodapé Estilo Profissional com Redes Sociais -->
    {% include footer.html %}
    
    <!-- Script de ativação do Menu Hambúrguer -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const menuToggle = document.getElementById('mobile-menu-toggle');
        const siteNav = document.getElementById('site-nav');

        if (menuToggle && siteNav) {
          menuToggle.addEventListener('click', function() {
            menuToggle.classList.toggle('active');
            siteNav.classList.toggle('active');
          });
        }
      });
    </script>

</body>
</html>
