<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO automático do Jekyll -->
  {% seo %}

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet"
  >

  <!-- Estilos do site -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >
</head>

<body class="{% if page.url == '/' or page.url == '/index.html' %}home-page{% endif %}">

  <!-- ======================================
       CABEÇALHO
       ====================================== -->
  <header class="site-header">
    <div class="site-header-container">

      <a
        class="site-logo-link"
        href="{{ '/' | relative_url }}"
        aria-label="Sua Melhor Ferramenta — página inicial"
      >
        <img
          src="{{ '/assets/images/logo.png' | relative_url }}"
          alt="Sua Melhor Ferramenta"
          class="site-logo-img"
        >
      </a>

      <!-- Botão do menu mobile -->
      <button
        type="button"
        class="mobile-menu-toggle"
        id="mobile-menu-toggle"
        aria-label="Abrir menu"
        aria-controls="site-nav"
        aria-expanded="false"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <!-- Navegação principal -->
      <nav
        class="site-nav"
        id="site-nav"
        aria-label="Navegação principal"
      >
        <ul>
          <li>
            <a
              href="{{ '/' | relative_url }}"
              {% if page.url == '/' or page.url == '/index.html' %}
                aria-current="page"
              {% endif %}
            >
              Início
            </a>
          </li>

          <li>
            <a
              href="{{ '/furadeiras/' | relative_url }}"
              {% if page.url == '/furadeiras/' %}
                aria-current="page"
              {% endif %}
            >
              Furadeiras
            </a>
          </li>

          <li>
            <a
              href="{{ '/parafusadeiras/' | relative_url }}"
              {% if page.url == '/parafusadeiras/' %}
                aria-current="page"
              {% endif %}
            >
              Parafusadeiras
            </a>
          </li>

          <li>
            <a
              href="{{ '/comparativos/' | relative_url }}"
              {% if page.url == '/comparativos/' %}
                aria-current="page"
              {% endif %}
            >
              Comparativos
            </a>
          </li>

          <li>
            <a
              href="{{ '/guias/' | relative_url }}"
              {% if page.url == '/guias/' %}
                aria-current="page"
              {% endif %}
            >
              Tutoriais e Dicas
            </a>
          </li>

          <li>
            <a
              href="{{ '/reviews/' | relative_url }}"
              {% if page.url == '/reviews/' %}
                aria-current="page"
              {% endif %}
            >
              Reviews
            </a>
          </li>

          <li>
            <a
              href="{{ '/sobre/' | relative_url }}"
              {% if page.url == '/sobre/' %}
                aria-current="page"
              {% endif %}
            >
              Sobre
            </a>
          </li>
        </ul>
      </nav>

    </div>
  </header>

  <!-- ======================================
       CONTEÚDO PRINCIPAL
       ====================================== -->
  <main class="site-content" id="conteudo-principal" tabindex="-1">
    {{ content }}
  </main>

  <!-- Rodapé compartilhado -->
  {% include footer.html %}

  <!-- ======================================
       CONTROLE DO MENU MOBILE
       ====================================== -->
  <script>
    (function () {
      function initializeMenu() {
        const menuToggle = document.getElementById("mobile-menu-toggle");
        const siteNav = document.getElementById("site-nav");
        const mainContent = document.getElementById("conteudo-principal");

        if (!menuToggle || !siteNav) return;

        // Evita registrar eventos repetidos.
        if (menuToggle.dataset.initialized === "true") return;
        menuToggle.dataset.initialized = "true";

        // Deve permanecer igual ao breakpoint do CSS.
        const mobileViewport = window.matchMedia("(max-width: 1100px)");

        function isMenuOpen() {
          return menuToggle.getAttribute("aria-expanded") === "true";
        }

        function setMenu(open) {
          menuToggle.classList.toggle("active", open);
          siteNav.classList.toggle("active", open);

          menuToggle.setAttribute("aria-expanded", String(open));
          menuToggle.setAttribute(
            "aria-label",
            open ? "Fechar menu" : "Abrir menu"
          );
        }

        // Abre ou fecha pelo botão.
        menuToggle.addEventListener("click", function () {
          if (!mobileViewport.matches) return;

          setMenu(!isMenuOpen());
        });

        // Fecha após selecionar um link.
        siteNav.addEventListener("click", function (event) {
          if (!(event.target instanceof Element)) return;

          const link = event.target.closest("a");

          if (!link || !mobileViewport.matches || !isMenuOpen()) {
            return;
          }

          const focusWasInside = siteNav.contains(document.activeElement);

          setMenu(false);

          if (focusWasInside) {
            menuToggle.focus();
          }
        });

        // Fecha com Escape.
        document.addEventListener("keydown", function (event) {
          if (
            event.key !== "Escape" ||
            !mobileViewport.matches ||
            !isMenuOpen()
          ) {
            return;
          }

          setMenu(false);
          menuToggle.focus();
        });

        // Fecha ao clicar fora.
        document.addEventListener("click", function (event) {
          if (!mobileViewport.matches || !isMenuOpen()) return;

          const clickedInside =
            siteNav.contains(event.target) ||
            menuToggle.contains(event.target);

          if (clickedInside) return;

          const focusWasInside = siteNav.contains(document.activeElement);

          setMenu(false);

          if (focusWasInside) {
            menuToggle.focus();
          }
        });

        // Fecha quando o foco sai do menu.
        document.addEventListener("focusin", function (event) {
          if (!mobileViewport.matches || !isMenuOpen()) return;

          const focusIsInside =
            siteNav.contains(event.target) ||
            menuToggle.contains(event.target);

          if (!focusIsInside) {
            setMenu(false);
          }
        });

        // Redefine o estado ao alternar entre desktop e mobile.
        mobileViewport.addEventListener("change", function (event) {
          const focusedElement = document.activeElement;
          const focusWasInNav = siteNav.contains(focusedElement);
          const focusWasOnToggle = focusedElement === menuToggle;

          setMenu(false);

          if (event.matches && focusWasInNav) {
            menuToggle.focus();
          } else if (!event.matches && focusWasOnToggle) {
            const firstLink = siteNav.querySelector("a");

            if (firstLink) {
              firstLink.focus();
            } else if (mainContent) {
              mainContent.focus();
            }
          }
        });

        setMenu(false);
      }

      if (document.readyState === "loading") {
        document.addEventListener(
          "DOMContentLoaded",
          initializeMenu,
          { once: true }
        );
      } else {
        initializeMenu();
      }
    })();
  </script>

  <!-- ======================================
       ADAPTAÇÃO DOS POSTS EXISTENTES

       Altera somente a página renderizada.
       Não modifica arquivos em _posts/.
       ====================================== -->
  <script>
    (function () {
      function adaptExistingPosts() {
        const content = document.getElementById("post-content");

        // Não altera a home ou páginas sem conteúdo de artigo.
        if (!content) return;

        // Evita processar o mesmo conteúdo duas vezes.
        if (content.dataset.layoutAdapted === "true") return;
        content.dataset.layoutAdapted = "true";

        const wrapperSelector = [
          ".specs-table-wrapper",
          ".competitors-table-wrapper",
          ".concorrentes-table-wrapper",
          ".table-wrapper"
        ].join(", ");

        /* ----------------------------------
           1. PREPARA TABELAS PARA ROLAGEM
           ---------------------------------- */

        content.querySelectorAll("table").forEach(function (table, index) {
          // Não modifica tabelas aninhadas em outras tabelas.
          if (table.parentElement.closest("table")) return;

          let wrapper = table.closest(wrapperSelector);

          // Preserva qualquer wrapper reconhecido já existente.
          if (!wrapper) {
            wrapper = document.createElement("div");
            wrapper.className = "table-wrapper auto-table-wrapper";

            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);
          }

          // Permite acessar a região pelo teclado.
          if (!wrapper.hasAttribute("tabindex")) {
            wrapper.setAttribute("tabindex", "0");
          }

          if (!wrapper.hasAttribute("role")) {
            wrapper.setAttribute("role", "region");
          }

          // Mantém os nomes acessíveis definidos no artigo.
          if (
            !wrapper.hasAttribute("aria-label") &&
            !wrapper.hasAttribute("aria-labelledby")
          ) {
            const caption = table.caption;
            const captionText = caption
              ? caption.textContent.replace(/\s+/g, " ").trim()
              : "";

            wrapper.setAttribute(
              "aria-label",
              captionText || "Tabela do artigo " + (index + 1)
            );
          }

          /* --------------------------------
             2. IDENTIFICA FICHAS SIMPLES
                DE DUAS COLUNAS
             -------------------------------- */

          if (!table.classList.contains("specs-table")) return;

          const rows = Array.from(table.rows);

          const hasRowSpan = rows.some(function (row) {
            return Array.from(row.cells).some(function (cell) {
              return cell.rowSpan !== 1;
            });
          });

          // Evita aplicar largura fixa em estruturas complexas.
          const hasNestedTable = Boolean(table.querySelector("table"));

          let maxColumns = 0;

          rows.forEach(function (row) {
            const columnCount = Array.from(row.cells).reduce(
              function (total, cell) {
                return total + cell.colSpan;
              },
              0
            );

            maxColumns = Math.max(maxColumns, columnCount);
          });

          if (
            maxColumns === 2 &&
            !hasRowSpan &&
            !hasNestedTable
          ) {
            table.classList.add("table-two-columns");
          }
        });

        /* ----------------------------------
           3. LINKS ABERTOS EM NOVA ABA

           Não troca URLs nem remove atributos.
           ---------------------------------- */

        content.querySelectorAll('a[target="_blank"]').forEach(
          function (link) {
            link.relList.add("noopener");
          }
        );
      }

      // Executa já no final do documento, reduzindo o intervalo
      // em que uma tabela pode aparecer sem o wrapper.
      adaptExistingPosts();
    })();
  </script>

</body>
</html>
