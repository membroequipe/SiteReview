<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Automático -->
    {% seo %}

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

    <!-- Menu Superior em Linha Única -->
    <header class="site-header" style="background: #ffffff; border-bottom: 1px solid #e2e8f0; width: 100%;">
        <div class="nav-container" style="max-width: 1000px; margin: 0 auto; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;">
            <a href="{{ '/' | relative_url }}" class="site-logo" style="font-weight: 700; font-size: 1.25rem; text-decoration: none; color: #1a202c;">Guia Especializado</a>
            
            <nav class="site-nav">
              <ul class="nav-list" style="display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; align-items: center;">
                <li><a href="{{ '/' | relative_url }}" style="text-decoration: none; color: #4a5568; font-weight: 500;">Início</a></li>
                <li><a href="{{ '/comparativos/' | relative_url }}" style="text-decoration: none; color: #4a5568; font-weight: 500;">Comparativos</a></li>
                <li><a href="{{ '/reviews/' | relative_url }}" style="text-decoration: none; color: #4a5568; font-weight: 500;">Reviews</a></li>
              </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="site-content">
        {{ content }}
    </main>

    <!-- Rodapé -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; {{ 'now' | date: "%Y" }} Guia Especializado. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
