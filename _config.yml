title: "Sua Melhor Ferramenta"
description: "Análises, comparativos e guias de compra de parafusadeiras e furadeiras para ajudar você a escolher a ferramenta ideal."
url: "https://suamelhorferramenta.com"
baseurl: ""
lang: pt-BR
locale: pt_BR
timezone: America/Sao_Paulo
markdown: kramdown
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
include:
  - _redirects
  
# Identidade editorial e logo para o jekyll-seo-tag
logo: /assets/images/logo.png

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      author: "Equipe de Análises"
